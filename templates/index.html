<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Horas Úteis</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2em auto; padding: 1em; line-height: 1.6; }
        input, select { padding: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Calculadora de Horas Úteis</h1>
    <p>Calcule o total de horas úteis para um mês específico, considerando feriados locais.</p>
    
    <form action="/calculate" method="get">
        <label for="pais">País:</label>
        <select id="pais" name="pais" required>
            <option value="">Selecione um país...</option>
            {% for codigo, nome in paises %}
                <option value="{{ codigo }}" {% if codigo == pais_selecionado %}selected{% endif %}>{{ nome }}</option>
            {% endfor %}
        </select>

        <label for="estado">Estado (Opcional):</label>
        <button type="button" id="detect-location" style="all: unset; cursor: pointer; color: #007bff; text-decoration: underline; font-size: 0.9em; margin-left: 10px;">Detectar meu estado</button>
        <select id="estado" name="estado">
            <option value="">--</option>
        </select>

        <label for="ano">Ano:</label>
        <select name="ano" id="ano">
            {% for ano_opcao in anos %}
                <option value="{{ ano_opcao }}" {% if ano_opcao == ano_selecionado %}selected{% endif %}>
                    {{ ano_opcao }}
                </option>
            {% endfor %}
        </select>

        <label for="mes">Mês:</label>
        <select name="mes" id="mes">
            {% for mes_opcao in meses %}
                <option value="{{ mes_opcao }}" {% if mes_opcao == mes_selecionado %}selected{% endif %}>
                    {{ mes_opcao }}
                </option>
            {% endfor %}
        </select>

        <label for="ferias">Dias de Férias no Mês (separados por vírgula):</label>
        <input type="text" id="ferias" name="ferias" placeholder="Ex: 10, 15, 20-25" value="{{ ferias_selecionadas or '' }}">

        <button type="submit">Calcular</button>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const paisSelect = document.getElementById('pais');
            const estadoSelect = document.getElementById('estado');
            const detectButton = document.getElementById('detect-location');
            
            // Guarda o estado que foi selecionado na última vez (vindo do Flask)
            const estadoInicialSelecionado = "{{ estado_selecionado or '' }}";

            // Função para buscar e popular os estados
            async function atualizarEstados(codigoPais, estadoParaSelecionar) {
                // Desabilita os campos durante o carregamento
                estadoSelect.innerHTML = '<option value="">Carregando...</option>';
                estadoSelect.disabled = true;
                detectButton.disabled = true;

                // Se nenhum país for selecionado, limpa e reabilita.
                if (!codigoPais) {
                    estadoSelect.innerHTML = '<option value="">--</option>';
                    estadoSelect.disabled = false;
                    detectButton.disabled = false;
                    return;
                }

                try {
                    const response = await fetch(`/api/states/${codigoPais}`);
                    const estados = await response.json();

                    estadoSelect.innerHTML = '<option value="">(Nenhum)</option>'; // Opção padrão

                    if (estados.length > 0) {
                        estados.forEach(function(estado) {
                            const option = new Option(estado.name, estado.code);
                            if (estado.code === estadoParaSelecionar) {
                                option.selected = true;
                            }
                            estadoSelect.add(option);
                        });
                    }
                } catch (error) {
                    console.error('Erro ao buscar estados:', error);
                    estadoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
                } finally {
                    // Garante que os campos sejam reabilitados ao final da operação.
                    estadoSelect.disabled = false;
                    detectButton.disabled = false;
                }
            }

            // Evento que dispara quando o usuário troca o país
            paisSelect.addEventListener('change', function() {
                atualizarEstados(this.value, null); // Ao trocar de país, não pré-seleciona nenhum estado
            });

            // Lógica para o botão de detecção
            detectButton.addEventListener('click', function() {
                if (!navigator.geolocation) {
                    alert('Geolocalização não é suportada pelo seu navegador.');
                    return;
                }

                this.textContent = 'Detectando...';
                this.disabled = true;

                navigator.geolocation.getCurrentPosition(async (position) => {
                    const { latitude, longitude } = position.coords;
                    
                    try {
                        // Usando a API Nominatim (OpenStreetMap) para geocodificação reversa
                        const geoResponse = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&accept-language=pt`);
                        const geoData = await geoResponse.json();

                        if (geoData && geoData.address) {
                            const countryCode = geoData.address.country_code?.toUpperCase();
                            const stateName = geoData.address.state;

                            // Se o país detectado for diferente do selecionado, atualiza tudo
                            if (countryCode && paisSelect.value !== countryCode) {
                                paisSelect.value = countryCode;
                                await atualizarEstados(countryCode, null); // Recarrega os estados
                            }
                            
                            // Tenta encontrar e selecionar o estado pelo nome completo
                            if (stateName) {
                                for (let option of estadoSelect.options) {
                                    if (option.text === stateName) {
                                        option.selected = true;
                                        break;
                                    }
                                }
                            }
                        }
                    } catch (error) {
                        console.error('Erro ao detectar a localização:', error);
                        alert('Não foi possível obter o nome do estado a partir da sua localização.');
                    } finally {
                        this.textContent = 'Detectar meu estado';
                        this.disabled = false;
                    }
                }, (error) => {
                    console.error('Erro de geolocalização:', error);
                    alert('Não foi possível obter sua localização. Verifique as permissões do navegador.');
                    this.textContent = 'Detectar meu estado';
                    this.disabled = false;
                });
            });

            // Executa uma vez no carregamento da página para popular os estados do país já selecionado
            if (paisSelect.value) {
                atualizarEstados(paisSelect.value, estadoInicialSelecionado);
            }
        });
    </script>
</body>
</html>
